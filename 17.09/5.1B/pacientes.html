<!DOCTYPE html>

<html lang="pt-BR"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estados do Nortedeste do Brasil</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Pacientes</h1>
        <!-- Esquerda: Listbox com as siglas -->
        <div class="painel-esquerdo">
            <select id="selectEstados" size="4">
                <option value="0" selected="">Luan Santana</option>
                <option value="1">Igor Guilherme</option>
                <option value="2">Natanzinho Lima</option>
                <option value="3">Travis Scott</option>
                <option value="4">Faustão</option>
                <option value="5">Mephis Depay</option>
                <option value="6">Tigrinho</option>
                <option value="7">Deolaine</option>
            </select>
        </div>

        <!-- Meio: Botão -->
        <div class="painel-meio">
            <button id="btnDetalhes">Detalhes</button>
        </div>

        <!-- Direita: Quatro divs/quadros de informações -->
        <div class="painel-direito">
            <div class="card-info">
                <strong>idade</strong>
                <div id="divCapital">-</div>
            </div>
            <div class="card-info">
                <strong>Profissão</strong>
                <div id="divArea">-</div>
            </div>
            <div class="card-info">
                <strong>Seguidores</strong>
                <div id="divPopulacao">-</div>
            </div>
            <div class="card-info">
                <strong>Foto</strong>
                <div id="divBandeira">-</div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>


</body></html>
